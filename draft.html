<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Draft CAD</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<style>
/* Layout: CAD workbench — file strip on top, tool rail left, drawing sheet centre, inspector right, command line along the bottom */
:root{
  --bg:#e7eae6; --panel:#f5f6f3; --raise:#ffffff; --line:#d0d6cf; --fg:#1b2420; --muted:#5b6862;
  --canvas:#fbfcf9; --grid:#edf0ec; --grid2:#dbe1da; --axis:#bcc6bb;
  --accent:#9c5a14; --accent-soft:#f1e2cc; --accent-fg:#ffffff; --sel:#d46f12; --hot:#c0390b;
  --win:#2e6bb0; --cross:#2c8a57; --warn:#b03a2a; --ok:#2c7a55; --amber:#b7791f; --measure:#b4532a; --snap:#b8902f;
  --ui:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:"Cascadia Mono","JetBrains Mono",Consolas,"SF Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111415; --panel:#181c1d; --raise:#202627; --line:#2b3335; --fg:#e2e8e4; --muted:#8b9791;
  --canvas:#0d1011; --grid:#151a1b; --grid2:#1e2526; --axis:#2e383a;
  --accent:#e3a352; --accent-soft:#38291a; --accent-fg:#1a1208; --sel:#f39a3d; --hot:#ff7043;
  --win:#5b9be3; --cross:#56c18c; --warn:#ec7563; --ok:#5cc79a; --amber:#e9b04f; --measure:#ef8a5e; --snap:#e3bd57; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111415; --panel:#181c1d; --raise:#202627; --line:#2b3335; --fg:#e2e8e4; --muted:#8b9791;
  --canvas:#0d1011; --grid:#151a1b; --grid2:#1e2526; --axis:#2e383a;
  --accent:#e3a352; --accent-soft:#38291a; --accent-fg:#1a1208; --sel:#f39a3d; --hot:#ff7043;
  --win:#5b9be3; --cross:#56c18c; --warn:#ec7563; --ok:#5cc79a; --amber:#e9b04f; --measure:#ef8a5e; --snap:#e3bd57; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:13px/1.35 var(--ui);display:grid;grid-template-columns:80px minmax(0,1fr) 300px;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden}
button,input,select{font:inherit;color:inherit}
.top{grid-column:1/-1;display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:10px}
.brand b{font-size:14px;letter-spacing:.02em}
.brand span{font-family:var(--mono);font-size:11px;color:var(--muted);max-width:28ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:1px solid var(--line);background:var(--raise);border-radius:4px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,.tool:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.btn.icon{width:32px;padding:0;justify-content:center}
.btn.small{height:26px;padding:0 8px;font-size:12px}
.btn svg{width:16px;height:16px;flex:none}
.btn[disabled]{opacity:.45;cursor:default}
.spacer{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{border:0;background:var(--raise);height:28px;padding:0 9px;cursor:pointer;font-size:12px}
.seg button.on{background:var(--accent);color:var(--accent-fg)}
.tools{grid-row:2;display:grid;grid-template-columns:repeat(2,34px);grid-auto-rows:min-content;justify-content:center;align-content:start;gap:2px;padding:6px 4px;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto}
.tools .grp{grid-column:1/-1;font-size:9px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);text-align:center;margin:6px 0 2px}
.tool{position:relative;width:34px;height:32px;display:grid;place-items:center;border:1px solid transparent;border-radius:4px;background:none;cursor:pointer;flex:none}
.tool svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tool:hover{background:var(--raise);border-color:var(--line)}
.tool.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.tool kbd{position:absolute;right:2px;bottom:0;font:9px var(--mono);color:var(--muted)}
.tool.view-preset{grid-column:1/-1;width:auto;height:28px;border-color:var(--line);background:var(--raise);font:600 11px var(--ui)!important}
.tool.view-preset:hover{border-color:var(--accent)}
.stage{grid-row:2;position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--canvas)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#ov{cursor:default;touch-action:none}
.drop{position:absolute;inset:12px;border:2px dashed var(--accent);border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,var(--canvas) 80%,transparent);font-size:16px;pointer-events:none}
.side{grid-row:2;display:flex;flex-direction:column;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;min-width:0}
.side section{padding:10px 12px;border-bottom:1px solid var(--line);flex:none}
.side h3{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;gap:8px}
.side h3 em{font-style:normal;text-transform:none;letter-spacing:0;color:var(--fg);font-weight:500}
.hint{color:var(--muted);font-size:12px;margin:0}
.hint li{margin:3px 0}
.hint ul{margin:6px 0 0;padding-left:16px}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 8px}
.kv.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.f{display:flex;flex-direction:column;gap:2px;min-width:0}
.f label{font-size:11px;color:var(--muted)}
.f input,.f select,.side select{width:100%;height:27px;padding:0 6px;border:1px solid var(--line);border-radius:3px;background:var(--raise);font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;min-width:0}
.f input[type=text].txt{font-family:var(--ui)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.chk{display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer}
.dimline{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;margin:0 0 8px}
.dimline b{color:var(--accent)}
.anchor{display:grid;grid-template-columns:repeat(3,18px);gap:3px}
.anchor button{width:18px;height:18px;border:1px solid var(--line);background:var(--raise);border-radius:2px;padding:0;cursor:pointer}
.anchor button.on{background:var(--accent);border-color:var(--accent)}
.radio{display:flex;flex-direction:column;gap:5px;margin-top:6px}
.sub{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.sub h4{margin:0 0 6px;font-size:12px;font-weight:600}
.vtable{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:3px}
.vtable table{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:11px}
.vtable th{position:sticky;top:0;background:var(--panel);font-weight:500;color:var(--muted);text-align:left;padding:3px 4px}
.vtable td{padding:1px 2px}
.vtable input{width:100%;height:22px;border:1px solid transparent;background:none;font:inherit;padding:0 3px;min-width:0}
.vtable input:hover,.vtable input:focus{border-color:var(--line);background:var(--raise)}
.layers{display:flex;flex-direction:column;gap:2px}
.layer{display:grid;grid-template-columns:18px 12px minmax(0,1fr) auto 18px;gap:6px;align-items:center;padding:3px 4px;border-radius:3px}
.layer.cur{background:var(--accent-soft)}
.layer .sw{width:12px;height:12px;border-radius:2px;border:1px solid var(--line)}
.layer .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.layer .ct{font-family:var(--mono);font-size:11px;color:var(--muted)}
.layer input{margin:0}
.bottom{grid-column:1/-1;display:flex;flex-direction:column;background:var(--panel);border-top:1px solid var(--line)}
.cmd{display:flex;align-items:center;gap:8px;padding:5px 10px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:12px}
.cmd #prompt{color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}
.cmd input{flex:1;min-width:80px;height:26px;border:1px solid var(--line);border-radius:3px;background:var(--raise);padding:0 8px;font-family:var(--mono)}
.status{display:flex;align-items:center;gap:4px;padding:3px 8px;font-size:11px;flex-wrap:wrap}
.status .co{font-family:var(--mono);font-variant-numeric:tabular-nums;min-width:22ch;color:var(--muted)}
.tg{border:1px solid transparent;background:none;border-radius:3px;padding:2px 7px;cursor:pointer;color:var(--muted);font-size:11px}
.tg.on{color:var(--fg);border-color:var(--line);background:var(--raise)}
.tg.on::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:5px;vertical-align:1px}
.status .info{margin-left:auto;color:var(--muted);font-family:var(--mono)}
#toast{position:fixed;left:50%;top:54px;transform:translateX(-50%);pointer-events:none;background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:4px;font-size:13px;max-width:min(560px,90vw);box-shadow:0 4px 18px rgba(0,0,0,.25);z-index:20}
#toast.warn{background:var(--warn);color:#fff}
.pbtn{display:none}

.tool.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
body.mode-3d .only-2d{display:none!important}
body:not(.mode-3d) .only-3d{display:none!important}
#canvas3d-wrap{position:absolute;inset:0}
#canvas3d-wrap canvas{display:block}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.stats div{background:var(--raise);border:1px solid var(--line);border-radius:4px;padding:5px 8px;display:flex;flex-direction:column;min-width:0}
.stats span{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.stats b{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.warnbox{margin-top:8px;padding:6px 8px;border:1px solid var(--amber);border-radius:4px;background:color-mix(in srgb,var(--amber) 12%,transparent);font-size:12px;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.flist,.plist,.mlist{display:flex;flex-direction:column;gap:2px;max-height:260px;overflow-y:auto}
.frow,.prow{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:3px;padding:4px 6px;cursor:pointer;font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
.frow:hover,.prow:hover{background:var(--raise);border-color:var(--line)}
.prow.on{background:var(--accent-soft);border-color:var(--accent)}
.frow .dot{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--measure)}
.frow .q{margin-left:auto;color:var(--muted)}
.prow .pn{font-weight:600;min-width:28px}
.prow .pd{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.pill{font-family:var(--ui);font-size:10px;font-weight:600;padding:1px 7px;border-radius:999px;white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pill.close{background:color-mix(in srgb,var(--amber) 18%,transparent);color:var(--amber)}
.pill.overlap,.pill.outside{background:color-mix(in srgb,var(--hot) 16%,transparent);color:var(--hot)}
.mrow{display:flex;align-items:center;gap:8px;padding:3px 6px;font-family:var(--mono);font-size:12px;border-bottom:1px solid var(--line)}
.mrow .mn{color:var(--muted);min-width:26px}.mrow .mv{color:var(--measure);font-weight:600;flex:1}
.x{border:0;background:none;cursor:pointer;color:var(--muted);font-size:12px;padding:2px 4px}
.grow{display:grid;grid-template-columns:16px minmax(0,1fr) auto auto;gap:6px;align-items:center;padding:2px 0;font-size:12px}
.grow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.grow .ct{font-family:var(--mono);font-size:11px;color:var(--muted)}
details.tips{margin-top:10px}details.tips summary{cursor:pointer;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.overlay{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(10,14,12,.45);padding:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.25);width:min(460px,100%);max-height:90vh;overflow:auto}
.card header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:600}
.card .body{padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.card footer{display:flex;gap:6px;justify-content:flex-end;padding:10px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.loading{position:absolute;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--canvas) 70%,transparent);z-index:5}
.loading div{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 18px;font-size:13px;display:flex;gap:10px;align-items:center}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.hint3{font-size:11px;color:var(--muted)}

.zoomctl{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:4px;z-index:3}
.zoomctl button{width:32px;height:32px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--fg);cursor:pointer;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.zoomctl button:hover{border-color:var(--accent)}
.zoomctl svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round}
.ctx{position:fixed;z-index:40;min-width:210px;background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:4px;display:flex;flex-direction:column}
.ctx button{display:flex;justify-content:space-between;gap:16px;align-items:center;text-align:left;border:0;background:none;padding:6px 10px;border-radius:4px;cursor:pointer;font-size:13px}
.ctx button:hover:not([disabled]),.ctx button:focus-visible{background:var(--accent-soft);outline:none}
.ctx button[disabled]{opacity:.4;cursor:default}
.ctx kbd{font:11px var(--mono);color:var(--muted)}
.ctx hr{border:0;border-top:1px solid var(--line);margin:3px 4px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:13px}
.keys kbd{font:12px var(--mono);background:var(--raise);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 6px;white-space:nowrap;justify-self:start}
.keys h4{grid-column:1/-1;margin:8px 0 0;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
@media (max-width:860px){
  body{grid-template-columns:46px minmax(0,1fr)}
  .tools{grid-template-columns:34px}
  .tool.view-preset{font-size:9px!important;padding:0}
  .status .tg[data-snap=qua],.status .tg[data-snap=grid],.status .tg[data-snap=per],#tWheel,.zoomctl{display:none}
  .side{position:fixed;right:0;top:44px;bottom:70px;width:min(320px,92vw);z-index:15;box-shadow:-4px 0 18px rgba(0,0,0,.2);display:none}
  body.panel-open .side{display:flex}
  .pbtn{display:inline-flex}
  .brand span,.hide-sm{display:none}
  /* one scrollable row instead of three wrapped ones */
  .top{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:6px 8px;gap:5px}
  .top::-webkit-scrollbar{display:none}
  .top>*{flex-shrink:0;order:2}
  .top>.brand,#modeSeg,#bOpen{order:0}
  #bPanel,#bSave{order:1}
  .brand{margin-right:2px}
  .top .spacer{display:none}
  .tools .grp{font-size:0;height:1px;background:var(--line);margin:5px 2px}
  .status{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .status::-webkit-scrollbar{display:none}
  .status .co{min-width:auto}
  .status>*{flex-shrink:0;white-space:nowrap}
  .cmd #prompt{max-width:55%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><b>Draft</b><span class="ver" style="font-family:var(--mono);font-size:10px;color:var(--muted)">v3.0</span><span id="fname"></span></div>
  <div class="seg" id="modeSeg"><button id="bMode2" class="on" data-i="m2d"></button><button id="bMode3" data-i="m3d"></button></div>
  <button class="btn primary" id="bOpen"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 6h5l2 2h7v8H3z"/></svg><span data-i="open"></span></button>
  <button class="btn only-2d" id="bIns"><span data-i="insert"></span></button>
  <button class="btn only-3d" id="bExport3"><span data-i="export3"></span></button>
  <button class="btn only-2d" id="bSave"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M10 3v10m-4-4 4 4 4-4M4 16h12"/></svg><span data-i="save"></span></button>
  <select id="fmt" class="btn hide-sm only-2d" style="padding:0 6px" aria-label="DXF">
    <option value="r12">DXF R12 · POLYLINE</option>
    <option value="lw">DXF · LWPOLYLINE</option>
  </select>
  <button class="btn only-2d" id="bNew"><span data-i="new"></span></button>
  <span class="sep"></span>
  <button class="btn only-2d icon" id="bUndo" data-ti="undo" data-k="Ctrl+Z"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M7 5 3 9l4 4M3 9h9a5 5 0 0 1 0 10h-2"/></svg></button>
  <button class="btn only-2d icon" id="bRedo" data-ti="redo" data-k="Ctrl+Y"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m13 5 4 4-4 4m4-4H8a5 5 0 0 0 0 10h2"/></svg></button>
  <button class="btn icon" id="bFit" data-ti="fit" data-k="Z"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4"/></svg></button>
  <span class="spacer"></span>
  <button class="btn pbtn" id="bPanel"><span data-i="props"></span></button>
  <div class="seg" id="langSeg"><button data-l="lt">LT</button><button data-l="en">EN</button></div>
  <button class="btn icon" id="bHelp" data-ti="helpTitle" data-k="?" style="font-weight:700">?</button>
  <button class="btn" id="bTheme" aria-label="Theme"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10" cy="10" r="6"/><path d="M10 4a6 6 0 0 0 0 12z" fill="currentColor"/></svg></button>
</header>
<nav class="tools only-2d" id="tools"></nav>
<nav class="tools only-3d" id="tools3">
  <div class="grp" data-i="views"></div>
  <button class="tool view-preset" data-view="iso" title="ISO" style="font:600 10px var(--mono)" data-i="v_iso"></button>
  <button class="tool view-preset" data-view="top" style="font:600 9px var(--ui)" data-i="v_top"></button>
  <button class="tool view-preset" data-view="front" style="font:600 9px var(--ui)" data-i="v_front"></button>
  <button class="tool view-preset" data-view="right" style="font:600 9px var(--ui)" data-i="v_right"></button>
  <div class="grp"></div>
  <button class="tool active" data-proj="persp" title="Perspective"><svg viewBox="0 0 20 20"><path d="M3 7l7-4 7 4v7l-7 4-7-4zM3 7l7 4 7-4M10 11v7"/></svg></button>
  <button class="tool" data-proj="ortho" title="Orthographic"><svg viewBox="0 0 20 20"><rect x="3" y="5" width="11" height="11"/><path d="M3 5l3-3h11v11l-3 3M14 5l3-3" stroke-dasharray="2 1.5"/></svg></button>
  <div class="grp"></div>
  <button class="tool" id="btnMeas3d" title="M"><svg viewBox="0 0 20 20"><path d="M2.5 13.5 13.5 2.5l4 4-11 11z"/><path d="M6 10l1.5 1.5M8.5 7.5 10 9M11 5l1.5 1.5"/></svg></button>
</nav>
<main class="stage" id="stage">

  if ($('meas3dHint')) $('meas3dHint').innerHTML = (typeof meas3d !== 'undefined' && meas3d.active) ? t('m3dOn') : t('m3dOff');
  if (typeof renderMeas3dList === 'function') renderMeas3dList(); if (S3.model3d) render3DStats();
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readColors);

const S3 = { mode: '2d', model3d: null, toggles3d: { shaded: true, wireframe: false, edges: true, ground: true, axes: true }, proj3d: 'persp' };
function fmt3d(n) { const a = Math.abs(n); return a >= 10000 ? n.toFixed(0) : a >= 100 ? n.toFixed(1) : a >= 1 ? n.toFixed(2) : n.toFixed(3); }
let THREE = null;
let OrbitControls = null;
let threePromise = null;

function loadThree() {
  if (threePromise) return threePromise;
  threePromise = (async () => {
    const three = await import('three');
    const oc = await import('three/addons/controls/OrbitControls.js');
    THREE = three;
    OrbitControls = oc.OrbitControls;
    return three;
  })();
  return threePromise;
}

// occt-import-js (OpenCASCADE WASM) for STEP / IGES / BREP parsing
let occtPromise = null;
function loadOCCT() {
  if (occtPromise) return occtPromise;
  occtPromise = (async () => {
    // The library ships a UMD script + a sibling .wasm file. We load the JS,
    // which exposes a global factory function, then initialize it. The factory
    // locates its .wasm via locateFile.
    const base = 'https://cdn.jsdelivr.net/npm/occt-import-js@0.0.23/dist/';
    await new Promise((resolve, reject) => {
      // Avoid double-injection
      if (window.occtimportjs) { resolve(); return; }
      const s = document.createElement('script');
      s.src = base + 'occt-import-js.js';
      s.onload = () => resolve();
      s.onerror = () => reject(new Error('Failed to load occt-import-js.js from CDN'));
      document.head.appendChild(s);
    });
    if (!window.occtimportjs) {
      throw new Error('occt-import-js global factory not found after script load');
    }
    const occt = await window.occtimportjs({
      locateFile: (path) => base + path,
    });
    return occt;
  })().catch(err => {
    occtPromise = null; // allow retry
    throw err;
  });
  return occtPromise;
}

// Convert an occt-import-js result (indexed meshes) into a flat triangle-soup
// Float32Array of positions, matching the format meshStats() and
// loadMeshIntoScene() already consume. Also collects per-mesh groups.
function occtResultToFlat(result) {
  if (!result || !result.success || !result.meshes || result.meshes.length === 0) {
    return null;
  }
  const flatPositions = [];
  const groups = [];
  let triStart = 0;

  for (let mi = 0; mi < result.meshes.length; mi++) {
    const m = result.meshes[mi];
    const pos = m.attributes && m.attributes.position && m.attributes.position.array;
    const idx = m.index && m.index.array;
    if (!pos || !idx) continue;

    let triCount = 0;
    for (let i = 0; i < idx.length; i += 3) {
      const a = idx[i] * 3, b = idx[i + 1] * 3, c = idx[i + 2] * 3;
      flatPositions.push(
        pos[a], pos[a + 1], pos[a + 2],
        pos[b], pos[b + 1], pos[b + 2],
        pos[c], pos[c + 1], pos[c + 2]
      );
      triCount++;
    }
    groups.push({
      name: m.name || ('Solid ' + (mi + 1)),
      start: triStart * 3,
      count: triCount * 3,
    });
    triStart += triCount;
  }

  return {
    positions: new Float32Array(flatPositions),
    groups: groups.length > 1 ? groups : null,
  };
}

// STL parser — handles both ASCII and binary formats
function parseSTL(buffer) {
  // Detect ASCII vs binary
  const view = new DataView(buffer);
  let isAscii = false;
  // ASCII STL starts with "solid"; binary's first 5 bytes might also be "solid" though
  // The robust check: binary STL has exactly 80-byte header + 4-byte triangle count + 50*N bytes
  if (buffer.byteLength >= 84) {
    const triCount = view.getUint32(80, true);
    if (84 + triCount * 50 === buffer.byteLength) {
      isAscii = false;
    } else {
      // Try ASCII: check first 5 bytes
      const head = new Uint8Array(buffer, 0, Math.min(5, buffer.byteLength));
      const headStr = String.fromCharCode(...head);
      isAscii = headStr.toLowerCase() === 'solid';
    }
  } else {
    const head = new Uint8Array(buffer);
    isAscii = String.fromCharCode(...head).toLowerCase().startsWith('solid');
  }

  const positions = [];
  const normals = [];

  if (isAscii) {
    const text = new TextDecoder().decode(buffer);
    const facetRe = /facet\s+normal\s+([-\d.eE+]+)\s+([-\d.eE+]+)\s+([-\d.eE+]+)[\s\S]*?vertex\s+([-\d.eE+]+)\s+([-\d.eE+]+)\s+([-\d.eE+]+)[\s\S]*?vertex\s+([-\d.eE+]+)\s+([-\d.eE+]+)\s+([-\d.eE+]+)[\s\S]*?vertex\s+([-\d.eE+]+)\s+([-\d.eE+]+)\s+([-\d.eE+]+)/g;
    let m;
    while ((m = facetRe.exec(text)) !== null) {
      const nx = +m[1], ny = +m[2], nz = +m[3];
      for (let i = 0; i < 3; i++) {
        positions.push(+m[4 + i * 3], +m[5 + i * 3], +m[6 + i * 3]);
        normals.push(nx, ny, nz);
      }
    }
  } else {
    const triCount = view.getUint32(80, true);
    let offset = 84;
    for (let i = 0; i < triCount; i++) {
      const nx = view.getFloat32(offset, true);
      const ny = view.getFloat32(offset + 4, true);
      const nz = view.getFloat32(offset + 8, true);
      offset += 12;
      for (let v = 0; v < 3; v++) {
        positions.push(
          view.getFloat32(offset, true),
          view.getFloat32(offset + 4, true),
          view.getFloat32(offset + 8, true)
        );
        normals.push(nx, ny, nz);
        offset += 12;
      }
      offset += 2; // attribute byte count
    }
  }

  return { positions: new Float32Array(positions), normals: new Float32Array(normals) };
}

// OBJ parser — minimal: vertices and faces. Triangulates polygons via fan.
function parseOBJ(text) {
  const verts = [];   // flat [x,y,z, x,y,z, ...]
  const normals = []; // [x,y,z,...] (may be empty)
  const uvs = [];
  const positions = [];
  const groups = {};  // groupName -> { indices: [], material: name }
  let currentGroup = 'default';
  groups[currentGroup] = { name: currentGroup, count: 0 };
  let currentGroupRef = groups[currentGroup];
  const outPositions = [];
  const outGroups = []; // [{start, count, name}]
  let currentSpan = { start: 0, count: 0, name: currentGroup };
  outGroups.push(currentSpan);

  const lines = text.split('\n');
  for (let i = 0; i < lines.length; i++) {
    const ln = lines[i].trim();
    if (!ln || ln.startsWith('#')) continue;
    const parts = ln.split(/\s+/);
    const kw = parts[0];
    if (kw === 'v') {
      verts.push(+parts[1], +parts[2], +parts[3]);
    } else if (kw === 'vn') {
      normals.push(+parts[1], +parts[2], +parts[3]);
    } else if (kw === 'vt') {
      uvs.push(+parts[1], +parts[2]);
    } else if (kw === 'g' || kw === 'o') {
      const name = parts.slice(1).join(' ') || 'unnamed';
      // close current span
      if (currentSpan.count > 0) {
        currentSpan = { start: outPositions.length / 3, count: 0, name };
        outGroups.push(currentSpan);
      } else {
        currentSpan.name = name;
      }
    } else if (kw === 'f') {
      // Parse face — each part can be "v", "v/vt", "v/vt/vn", or "v//vn"
      const faceVerts = [];
      for (let j = 1; j < parts.length; j++) {
        const tok = parts[j];
        const idx = parseInt(tok.split('/')[0], 10);
        // Negative indices count from end
        const vi = idx > 0 ? (idx - 1) : (verts.length / 3 + idx);
        faceVerts.push(vi);
      }
      // Triangulate (fan from vertex 0)
      for (let j = 1; j < faceVerts.length - 1; j++) {
        const i0 = faceVerts[0], i1 = faceVerts[j], i2 = faceVerts[j + 1];
        outPositions.push(
          verts[i0 * 3], verts[i0 * 3 + 1], verts[i0 * 3 + 2],
          verts[i1 * 3], verts[i1 * 3 + 1], verts[i1 * 3 + 2],
          verts[i2 * 3], verts[i2 * 3 + 1], verts[i2 * 3 + 2]
        );
        currentSpan.count += 3;
      }
    }
  }

  // Filter out empty groups
  const finalGroups = outGroups.filter(g => g.count > 0);
  return { positions: new Float32Array(outPositions), groups: finalGroups };
}

// Compute mesh statistics from position array (flat [x,y,z, ...] with each triangle as 9 floats)
function meshStats(positions) {
  let minX = Infinity, minY = Infinity, minZ = Infinity;
  let maxX = -Infinity, maxY = -Infinity, maxZ = -Infinity;
  let surfaceArea = 0;
  let signedVolume = 0;

  const n = positions.length;
  for (let i = 0; i < n; i += 9) {
    const ax = positions[i], ay = positions[i + 1], az = positions[i + 2];
    const bx = positions[i + 3], by = positions[i + 4], bz = positions[i + 5];
    const cx = positions[i + 6], cy = positions[i + 7], cz = positions[i + 8];

    if (ax < minX) minX = ax; if (ay < minY) minY = ay; if (az < minZ) minZ = az;
    if (ax > maxX) maxX = ax; if (ay > maxY) maxY = ay; if (az > maxZ) maxZ = az;
    if (bx < minX) minX = bx; if (by < minY) minY = by; if (bz < minZ) minZ = bz;
    if (bx > maxX) maxX = bx; if (by > maxY) maxY = by; if (bz > maxZ) maxZ = bz;
    if (cx < minX) minX = cx; if (cy < minY) minY = cy; if (cz < minZ) minZ = cz;
    if (cx > maxX) maxX = cx; if (cy > maxY) maxY = cy; if (cz > maxZ) maxZ = cz;

    // Surface area: 1/2 |AB x AC|
    const abx = bx - ax, aby = by - ay, abz = bz - az;
    const acx = cx - ax, acy = cy - ay, acz = cz - az;
    const crx = aby * acz - abz * acy;
    const cry = abz * acx - abx * acz;
    const crz = abx * acy - aby * acx;
    surfaceArea += 0.5 * Math.hypot(crx, cry, crz);

    // Signed volume of tetra (origin, A, B, C) = (A · (B × C)) / 6
    const bcx = by * cz - bz * cy;
    const bcy = bz * cx - bx * cz;
    const bcz = bx * cy - by * cx;
    signedVolume += (ax * bcx + ay * bcy + az * bcz) / 6;
  }

  return {
    bbox: { min: { x: minX, y: minY, z: minZ }, max: { x: maxX, y: maxY, z: maxZ } },
    triangleCount: n / 9,
    vertexCount: n / 3,
    surfaceArea,
    volume: Math.abs(signedVolume),
  };
}

const three = {
  scene: null,
  perspCamera: null,
  orthoCamera: null,
  activeCamera: null,
  renderer: null,
  controls: null,
  mesh: null,
  wireOverlay: null,
  edgesOverlay: null,
  groundGrid: null,
  axesHelper: null,
  rafId: null,
  modelGroup: null,
};

async function init3DScene() {
  if (three.scene) return;
  await loadThree();

  const container = document.getElementById('canvas3d-wrap');
  const { w, h } = get3DViewportSize();

  three.scene = new THREE.Scene();
  three.scene.background = new THREE.Color(themeColors().bg);

  three.perspCamera = new THREE.PerspectiveCamera(45, w / h, 0.1, 100000);
  three.perspCamera.position.set(100, 100, 100);

  three.orthoCamera = new THREE.OrthographicCamera(-50, 50, 50, -50, 0.01, 100000);
  three.orthoCamera.position.set(100, 100, 100);

  three.activeCamera = three.perspCamera;

  three.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  three.renderer.setPixelRatio(window.devicePixelRatio || 1);
  three.renderer.setSize(w, h);
  three.renderer.shadowMap.enabled = false;
  container.appendChild(three.renderer.domElement);

  three.controls = new OrbitControls(three.activeCamera, three.renderer.domElement);
  three.controls.enableDamping = true;
  three.controls.dampingFactor = 0.08;

  // Lighting — soft, calm, matches our palette
  const hemiInit = (!isDark) ? 0.9 : 0.7;
  const hemi = new THREE.HemisphereLight(0xb8c5d6, 0x2a2f38, hemiInit);
  three.hemiLight = hemi;
  three.scene.add(hemi);

  const dir1 = new THREE.DirectionalLight(0xffffff, 0.55);
  dir1.position.set(120, 200, 80);
  three.scene.add(dir1);

  const dir2 = new THREE.DirectionalLight(0xa8c5d8, 0.25);
  dir2.position.set(-100, 50, -80);
  three.scene.add(dir2);

  const fillAmbient = new THREE.AmbientLight(0xffffff, 0.15);
  three.scene.add(fillAmbient);

  three.modelGroup = new THREE.Group();
  three.scene.add(three.modelGroup);

  // Ground grid — drawn in XZ plane (Y up)
  three.groundGrid = new THREE.GridHelper(2000, 40, 0x2f3540, 0x232830);
  three.groundGrid.material.transparent = true;
  three.groundGrid.material.opacity = 0.6;
  three.scene.add(three.groundGrid);

  // Axes helper — small, in corner
  three.axesHelper = new THREE.AxesHelper(50);
  three.scene.add(three.axesHelper);

  // Resize observer for the container
  const ro = new ResizeObserver(() => resize3D());
  ro.observe(container);

  // Animation loop
  function animate() {
    three.rafId = requestAnimationFrame(animate);
    if (three.controls) three.controls.update();
    if (meas3d.group && meas3d.group.children.length) updateMeasScale();
    if (three.renderer && three.activeCamera && three.scene) {
      three.renderer.render(three.scene, three.activeCamera);
    }
  }
  animate();
  initMeasure3dHandlers();
}

function resize3D() {
  if (!three.renderer) return;
  const { w, h } = get3DViewportSize();
  // setSize WITH style update (no `false`) so the <canvas> element actually
  // fills the viewport — passing false leaves it stuck at its initial size.
  three.renderer.setSize(w, h);
  three.renderer.domElement.style.width = '100%';
  three.renderer.domElement.style.height = '100%';
  three.renderer.domElement.style.display = 'block';
  if (three.perspCamera) {
    three.perspCamera.aspect = w / h;
    three.perspCamera.updateProjectionMatrix();
  }
  if (three.orthoCamera && S3.model3d) {
    updateOrthoFrustum();
  }
}

function get3DViewportSize() {
  const container = document.getElementById('canvas3d-wrap');
  if (!container) return { w: 800, h: 600 };
  const parent = container.parentElement;
  let w = container.clientWidth, h = container.clientHeight;
  if (!w || !h) {
    const pr = parent ? parent.getBoundingClientRect() : null;
    w = (pr && pr.width) || w || 800;
    h = (pr && pr.height) || h || 600;
  }
  return { w, h };
}

function updateOrthoFrustum() {
  if (!S3.model3d || !three.orthoCamera) return;
  const { w, h } = get3DViewportSize();
  const aspect = w / h;
  const bb = S3.model3d.bbox;
  const dx = bb.max.x - bb.min.x;
  const dy = bb.max.y - bb.min.y;
  const dz = bb.max.z - bb.min.z;
  const maxDim = Math.max(dx, dy, dz);
  const half = maxDim * 0.7;
  three.orthoCamera.left = -half * aspect;
  three.orthoCamera.right = half * aspect;
  three.orthoCamera.top = half;
  three.orthoCamera.bottom = -half;
  three.orthoCamera.updateProjectionMatrix();
}

function loadMeshIntoScene(positions, normals, groups) {
  if (!three.scene) return;

  // Clear previous model
  while (three.modelGroup.children.length > 0) {
    const c = three.modelGroup.children.pop();
    if (c.geometry) c.geometry.dispose();
    if (c.material) {
      if (Array.isArray(c.material)) c.material.forEach(m => m.dispose());
      else c.material.dispose();
    }
  }
  three.mesh = null;
  three.groupMeshes = []; // [{ name, mesh, edges, wire, visible }]

  // Overall bounding box (for centering + framing)
  let minX = Infinity, minY = Infinity, minZ = Infinity;
  let maxX = -Infinity, maxY = -Infinity, maxZ = -Infinity;
  for (let i = 0; i < positions.length; i += 3) {
    const x = positions[i], y = positions[i + 1], z = positions[i + 2];
    if (x < minX) minX = x; if (y < minY) minY = y; if (z < minZ) minZ = z;
    if (x > maxX) maxX = x; if (y > maxY) maxY = y; if (z > maxZ) maxZ = z;
  }
  // Center the bbox center at the world origin on ALL axes. STEP/IGES models are
  // often authored far from origin; this guarantees the camera frames them.
  const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2, cz = (minZ + maxZ) / 2;
  three.modelGroup.position.set(-cx, -cy, -cz);
  three._modelSize = { x: maxX - minX, y: maxY - minY, z: maxZ - minZ };

  const colors = themeColors();

  // Build slices: one mesh per group (so each can be hidden), or a single mesh.
  let slices;
  if (groups && groups.length > 1) {
    // group.start / group.count are in VERTEX units (multiples of 3)
    slices = groups.map(g => ({ name: g.name, vStart: g.start, vCount: g.count }));
  } else {
    slices = [{ name: 'Model', vStart: 0, vCount: positions.length / 3 }];
  }

  for (const slice of slices) {
    const fStart = slice.vStart * 3;
    const fEnd = (slice.vStart + slice.vCount) * 3;
    const gPositions = positions.slice(fStart, fEnd);
    if (gPositions.length === 0) continue;

    const geom = new THREE.BufferGeometry();
    geom.setAttribute('position', new THREE.BufferAttribute(gPositions, 3));
    geom.computeVertexNormals();

    const mat = new THREE.MeshStandardMaterial({
      color: colors.meshColor,
      roughness: 0.65,
      metalness: 0.12,
      flatShading: false,
      side: THREE.DoubleSide,
    });
    const mesh = new THREE.Mesh(geom, mat);
    three.modelGroup.add(mesh);

    const edgesGeom = new THREE.EdgesGeometry(geom, 30);
    const edges = new THREE.LineSegments(edgesGeom,
      new THREE.LineBasicMaterial({ color: colors.edgeColor, transparent: true, opacity: 0.5 }));
    three.modelGroup.add(edges);

    const wireGeom = new THREE.WireframeGeometry(geom);
    const wire = new THREE.LineSegments(wireGeom,
      new THREE.LineBasicMaterial({ color: colors.wireColor, transparent: true, opacity: 0.3 }));
    wire.visible = false;
    three.modelGroup.add(wire);

    three.groupMeshes.push({ name: slice.name, mesh, edges, wire, visible: true });
  }

  three.mesh = three.groupMeshes[0] ? three.groupMeshes[0].mesh : null;

  applyVisibility3D();
  // Fit now (covers reload-while-in-3D), then once more next frame so the
  // camera aspect reflects the real on-screen container size and the model
  // ends up centered in the viewport rather than off in a corner.
  fitView3D();
  requestAnimationFrame(() => {
    if (S3.mode === '3d' && S3.model3d) { resize3D(); fitView3D(); }
  });
}

// Theme-aware colors for 3D content
function themeColors() {
  const light = (!isDark);
  return light
    ? { meshColor: 0x8a929c, edgeColor: 0x3a4250, wireColor: 0x2c8aa6, bg: 0xeef1f5 }
    : { meshColor: 0xb8bfc8, edgeColor: 0x4a525e, wireColor: 0x4fd1c5, bg: 0x1a1d23 };
}

// Grid colors adapt to theme
function gridColors() {
  const light = (!isDark);
  return light
    ? { major: 0xb8c2cf, minor: 0xd8dee6 }
    : { major: 0x2f3540, minor: 0x232830 };
}

function applyVisibility3D() {
  if (!three.scene) return;
  const t = S3.toggles3d;
  for (const g of (three.groupMeshes || [])) {
    const on = g.visible !== false;
    if (g.mesh) g.mesh.visible = on && t.shaded;
    if (g.edges) g.edges.visible = on && t.edges;
    if (g.wire) g.wire.visible = on && t.wireframe;
  }
  if (three.groundGrid) three.groundGrid.visible = t.ground;
  if (three.axesHelper) three.axesHelper.visible = t.axes;
}

function fitView3D() {
  if (!three.scene || !S3.model3d) return;
  const sz = three._modelSize || { x: 100, y: 100, z: 100 };
  const maxDim = Math.max(sz.x, sz.y, sz.z, 1);
  const gc = gridColors();

  // Resize ground grid to ~2.5x model size; drop it to the model's bottom
  if (three.groundGrid) {
    three.scene.remove(three.groundGrid);
    three.groundGrid.geometry.dispose();
    three.groundGrid.material.dispose();
    const gridSize = Math.max(maxDim * 2.5, 50);
    three.groundGrid = new THREE.GridHelper(gridSize, 24, gc.major, gc.minor);
    three.groundGrid.material.transparent = true;
    three.groundGrid.material.opacity = 0.5;
    three.groundGrid.position.y = -sz.y / 2;
    three.groundGrid.visible = S3.toggles3d.ground;
    three.scene.add(three.groundGrid);
  }

  // Resize axes, place at model's lower corner
  if (three.axesHelper) {
    three.scene.remove(three.axesHelper);
    three.axesHelper.geometry.dispose();
    three.axesHelper.material.dispose();
    three.axesHelper = new THREE.AxesHelper(maxDim * 0.5);
    three.axesHelper.position.set(-sz.x / 2, -sz.y / 2, -sz.z / 2);
    three.axesHelper.visible = S3.toggles3d.axes;
    three.scene.add(three.axesHelper);
  }

  if (three.activeCamera.isPerspectiveCamera) {
    const fov = three.activeCamera.fov * Math.PI / 180;
    const aspect = three.activeCamera.aspect || 1;
    // Use the bounding-sphere radius (half the space diagonal) so the whole
    // model fits from any orbit angle, regardless of which axis is longest.
    const radius = 0.5 * Math.sqrt(sz.x * sz.x + sz.y * sz.y + sz.z * sz.z);
    // Distance needed to fit vertically; widen if the viewport is portrait
    const fitV = radius / Math.sin(fov / 2);
    const fitH = fitV / Math.min(aspect, 1);
    const distance = Math.max(fitV, fitH) * 1.15;
    setView3D('iso', distance);
  } else {
    updateOrthoFrustum();
    setView3D('iso', maxDim * 1.8);
  }
}

function setView3D(preset, distOverride) {
  if (!three.scene || !three.activeCamera) return;
  const sz = three._modelSize || { x: 100, y: 100, z: 100 };
  const maxDim = Math.max(sz.x, sz.y, sz.z, 1);
  const d = distOverride || maxDim * 1.8;

  // Model is centered at the origin on all axes → always look at (0,0,0)
  const target = new THREE.Vector3(0, 0, 0);

  let pos;
  switch (preset) {
    case 'iso': pos = new THREE.Vector3(d * 0.8, d * 0.7, d * 0.8); break;
    case 'top': pos = new THREE.Vector3(0, d, 0.001); break;
    case 'front': pos = new THREE.Vector3(0, 0, d); break;
    case 'right': pos = new THREE.Vector3(d, 0, 0); break;
    default: pos = new THREE.Vector3(d * 0.8, d * 0.7, d * 0.8);
  }
  three.activeCamera.position.copy(pos);
  three.activeCamera.up.set(0, 1, 0);
  three.controls.target.copy(target);
  three.controls.update();

  document.querySelectorAll('.view-preset').forEach(el => {
    el.classList.toggle('active', el.dataset.view === preset);
  });
}

function setProjection3D(proj) {
  if (!three.scene) return;
  S3.proj3d = proj;
  const oldPos = three.activeCamera.position.clone();
  const oldTarget = three.controls.target.clone();
  three.activeCamera = (proj === 'persp') ? three.perspCamera : three.orthoCamera;
  three.activeCamera.position.copy(oldPos);
  three.controls.object = three.activeCamera;
  three.controls.target.copy(oldTarget);
  if (proj === 'ortho') updateOrthoFrustum();
  three.controls.update();
  document.querySelectorAll('[data-proj]').forEach(el => {
    el.classList.toggle('active', el.dataset.proj === proj);
  });
}

const meas3d = {
  active: false,            // measure mode on/off
  pending: null,            // THREE.Vector3 of first picked point (world space)
  measurements: [],         // [{ a:Vec3, b:Vec3, dist, objects:[...] }]
  group: null,              // THREE.Group holding all measure visuals
  hoverDot: null,           // marker following the snapped cursor point
  hoverRing: null,          // ring shown when the hover point is locked to a vertex
  previewObjs: null,        // [line, label] rubber-band preview to the cursor
  _pendingDot: null,        // first-point marker while picking the second
  draggingDim: null,        // measurement whose dimension line is being slid
  raycaster: null,
};

function ensureMeasGroup() {
  if (!three.scene) return;
  if (!meas3d.group) {
    meas3d.group = new THREE.Group();
    meas3d.group.renderOrder = 999;
    three.scene.add(meas3d.group);
  }
  if (!meas3d.raycaster) meas3d.raycaster = new THREE.Raycaster();
}

function measColorHex() {
  // Read the --measure CSS var so it adapts to the theme
  const c = getComputedStyle(document.documentElement).getPropertyValue('--measure').trim() || '#c2674a';
  return new THREE.Color(c).getHex();
}

// Build a small camera-facing dot at a world position
function makeMeasDot(worldPos, color) {
  const geo = new THREE.SphereGeometry(1, 16, 12);
  const mat = new THREE.MeshBasicMaterial({ color, depthTest: false, transparent: true });
  const dot = new THREE.Mesh(geo, mat);
  dot.position.copy(worldPos);
  dot.renderOrder = 1000;
  // scale set each frame in updateMeasScale()
  return dot;
}

// Text label as a sprite that always faces the camera
function makeMeasLabel(text, worldPos, color) {
  const pad = 8, fontPx = 48;
  const cv = document.createElement('canvas');
  const cx = cv.getContext('2d');
  cx.font = `600 ${fontPx}px Consolas, monospace`;
  const w = cx.measureText(text).width;
  cv.width = Math.ceil(w + pad * 2);
  cv.height = fontPx + pad * 2;
  // bg pill
  const bg = getComputedStyle(document.documentElement).getPropertyValue('--panel').trim() || '#ffffff';
  cx.fillStyle = bg;
  cx.globalAlpha = 0.92;
  roundRect(cx, 0, 0, cv.width, cv.height, 10);
  cx.fill();
  cx.globalAlpha = 1;
  cx.strokeStyle = '#' + color.toString(16).padStart(6, '0');
  cx.lineWidth = 3;
  roundRect(cx, 1.5, 1.5, cv.width - 3, cv.height - 3, 10);
  cx.stroke();
  cx.font = `600 ${fontPx}px Consolas, monospace`;
  cx.fillStyle = '#' + color.toString(16).padStart(6, '0');
  cx.textBaseline = 'middle';
  cx.fillText(text, pad, cv.height / 2 + 2);

  const tex = new THREE.CanvasTexture(cv);
  tex.minFilter = THREE.LinearFilter;
  const mat = new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true });
  const sp = new THREE.Sprite(mat);
  sp.position.copy(worldPos);
  sp.renderOrder = 1001;
  sp.userData.aspect = cv.width / cv.height;
  return sp;
}

function roundRect(cx, x, y, w, h, r) {
  cx.beginPath();
  cx.moveTo(x + r, y);
  cx.arcTo(x + w, y, x + w, y + h, r);
  cx.arcTo(x + w, y + h, x, y + h, r);
  cx.arcTo(x, y + h, x, y, r);
  cx.arcTo(x, y, x + w, y, r);
  cx.closePath();
}

// Keep dots/labels a constant on-screen size as the camera moves
function updateMeasScale() {
  if (!meas3d.group || !three.activeCamera) return;
  // Size dots and labels from the MODEL size (not camera distance) so a label never covers the part.
  const sz = three._modelSize || { x: 100, y: 100, z: 100 };
  const m = Math.max(sz.x, sz.y, sz.z, 1);
  const dot = m * 0.008, lab = m * 0.04;
  meas3d.group.traverse(obj => {
    if (obj.userData && obj.userData.isMeasDot) obj.scale.setScalar(dot);
    else if (obj.isSprite) { const a = obj.userData.aspect || 3; obj.scale.set(lab * a, lab, 1); }
  });
}

// Raycast from a pointer event; return { point, snapped, screen } in WORLD space, or null.
// Snapping prefers the nearest mesh vertex to the CURSOR in screen space (like
// 2D endpoint snap) so clicking near a corner reliably grabs that corner.
function pickModelPoint(ev) {
  ensureMeasGroup();
  if (!three.groupMeshes || three.groupMeshes.length === 0) return null;
  const container = document.getElementById('canvas3d-wrap');
  const r = container.getBoundingClientRect();
  const px = ev.clientX - r.left, py = ev.clientY - r.top;
  const ndc = new THREE.Vector2((px / r.width) * 2 - 1, -(py / r.height) * 2 + 1);
  meas3d.raycaster.setFromCamera(ndc, three.activeCamera);
  const meshes = three.groupMeshes.filter(g => g.mesh && g.mesh.visible).map(g => g.mesh);
  const hits = meas3d.raycaster.intersectObjects(meshes, false);
  if (hits.length === 0) return null;
  const hit = hits[0];
  let point = hit.point.clone();
  let snapped = false;

  // Screen-space vertex snap: project candidate vertices and pick the one
  // closest to the cursor within a pixel radius. We search the hit triangle's
  // verts plus a small neighborhood of nearby verts for robust corner snapping.
  const cam = three.activeCamera;
  const geom = hit.object.geometry;
  const posAttr = geom.getAttribute('position');
  if (posAttr && hit.face) {
    const snapPxRadius = 18; // how close (px) the cursor must be to snap
    const toScreen = (v) => {
      const p = v.clone().project(cam);
      return { x: (p.x * 0.5 + 0.5) * r.width, y: (-p.y * 0.5 + 0.5) * r.height, z: p.z };
    };
    // Gather candidate vertex indices: the hit face plus all verts whose world
    // pos is within a few * the face size of the hit (keeps it cheap).
    const v0 = new THREE.Vector3().fromBufferAttribute(posAttr, hit.face.a);
    hit.object.localToWorld(v0);
    const near = hit.point.distanceTo(v0) || 1;
    const searchR = Math.max(near * 6, (three._modelSize ? Math.max(three._modelSize.x, three._modelSize.y, three._modelSize.z) : 100) * 0.15);
    let best = null, bestPx = Infinity;
    const tmp = new THREE.Vector3();
    const count = posAttr.count;
    // Cap the scan for very large meshes
    const stride = count > 60000 ? Math.ceil(count / 60000) : 1;
    for (let i = 0; i < count; i += stride) {
      tmp.fromBufferAttribute(posAttr, i);
      hit.object.localToWorld(tmp);
      if (tmp.distanceTo(hit.point) > searchR) continue;
      const s = toScreen(tmp);
      const d = Math.hypot(s.x - px, s.y - py);
      if (d < bestPx) { bestPx = d; best = tmp.clone(); }
    }
    if (best && bestPx <= snapPxRadius) { point = best; snapped = true; }
  }
  return { point, snapped, screen: { x: px, y: py } };
}

// Compute a default offset direction: perpendicular to the segment, lying in
// the plane facing the camera, so the dimension reads cleanly from this view.
function defaultOffsetDir(a, b) {
  const seg = b.clone().sub(a);
  if (seg.lengthSq() < 1e-9) return new THREE.Vector3(1, 0, 0);
  seg.normalize();
  const viewDir = three.activeCamera
    ? three.activeCamera.position.clone().sub(a.clone().add(b).multiplyScalar(0.5)).normalize()
    : new THREE.Vector3(0, 0, 1);
  let dir = new THREE.Vector3().crossVectors(seg, viewDir);
  if (dir.lengthSq() < 1e-6) {
    // segment is parallel to view dir; fall back to a world-up perpendicular
    dir = new THREE.Vector3().crossVectors(seg, new THREE.Vector3(0, 1, 0));
    if (dir.lengthSq() < 1e-6) dir = new THREE.Vector3(1, 0, 0);
  }
  return dir.normalize();
}

function addMeasurement(a, b) {
  ensureMeasGroup();
  const dist = a.distanceTo(b);
  const sz = three._modelSize ? Math.max(three._modelSize.x, three._modelSize.y, three._modelSize.z, 1) : 100;
  const m = {
    a: a.clone(),
    b: b.clone(),
    dist,
    offsetDir: defaultOffsetDir(a, b),
    offsetDist: sz * 0.08,   // default: a little to the side
    objects: [],
  };
  buildMeasurementObjects(m);
  meas3d.measurements.push(m);
  updateMeasScale();
  renderMeas3dList();
}

// (Re)build the three.js objects for one measurement: extension lines, the
// offset dimension line, endpoint dots, and the value label.
function buildMeasurementObjects(m) {
  // dispose existing
  if (m.objects) {
    for (const o of m.objects) {
      meas3d.group.remove(o);
      if (o.geometry) o.geometry.dispose();
      if (o.material) { if (o.material.map) o.material.map.dispose(); o.material.dispose(); }
    }
  }
  const color = measColorHex();
  const off = m.offsetDir.clone().multiplyScalar(m.offsetDist);
  const a2 = m.a.clone().add(off);     // dimension-line endpoints (offset to side)
  const b2 = m.b.clone().add(off);

  const objs = [];
  const lineMat = () => new THREE.LineBasicMaterial({ color, depthTest: false, transparent: true });

  // Extension / witness lines from the geometry out to the dimension line
  if (m.offsetDist > 1e-6) {
    const extA = new THREE.Line(new THREE.BufferGeometry().setFromPoints([m.a, a2.clone().add(m.offsetDir.clone().multiplyScalar(m.offsetDist * 0.12))]), lineMat());
    const extB = new THREE.Line(new THREE.BufferGeometry().setFromPoints([m.b, b2.clone().add(m.offsetDir.clone().multiplyScalar(m.offsetDist * 0.12))]), lineMat());
    extA.renderOrder = 999; extB.renderOrder = 999;
    meas3d.group.add(extA); meas3d.group.add(extB);
    objs.push(extA, extB);
  }

  // The dimension line itself (offset to the side)
  const dimLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints([a2, b2]), lineMat());
  dimLine.renderOrder = 999;
  dimLine.userData.isDimLine = true; // used for drag hit-testing
  meas3d.group.add(dimLine);
  objs.push(dimLine);

  // Endpoint dots on the actual geometry
  const dotA = makeMeasDot(m.a, color); dotA.userData.isMeasDot = true;
  const dotB = makeMeasDot(m.b, color); dotB.userData.isMeasDot = true;
  meas3d.group.add(dotA); meas3d.group.add(dotB);
  objs.push(dotA, dotB);

  // Label at the dimension-line midpoint
  const mid = a2.clone().add(b2).multiplyScalar(0.5);
  const label = makeMeasLabel(fmt3d(m.dist) + ' mm', mid, color);
  meas3d.group.add(label);
  objs.push(label);

  m.objects = objs;
  m._a2 = a2; m._b2 = b2; // cache for drag hit-testing
}

function clearPendingMeasMarker() {
  if (meas3d._pendingDot) {
    meas3d.group.remove(meas3d._pendingDot);
    meas3d._pendingDot.geometry.dispose();
    meas3d._pendingDot.material.dispose();
    meas3d._pendingDot = null;
  }
}

// Project a world point to screen pixels within the 3D viewport
function worldToScreen3D(v) {
  const container = document.getElementById('canvas3d-wrap');
  const r = container.getBoundingClientRect();
  const p = v.clone().project(three.activeCamera);
  return { x: (p.x * 0.5 + 0.5) * r.width, y: (-p.y * 0.5 + 0.5) * r.height };
}

// Find a measurement whose offset dimension line is under the cursor (screen px)
function hitTestDimLine3D(ev) {
  const container = document.getElementById('canvas3d-wrap');
  const r = container.getBoundingClientRect();
  const px = ev.clientX - r.left, py = ev.clientY - r.top;
  const tol = 8;
  for (let i = meas3d.measurements.length - 1; i >= 0; i--) {
    const m = meas3d.measurements[i];
    if (!m._a2 || !m._b2) continue;
    const a = worldToScreen3D(m._a2), b = worldToScreen3D(m._b2);
    const dx = b.x - a.x, dy = b.y - a.y, l2 = dx * dx + dy * dy;
    let t = l2 ? ((px - a.x) * dx + (py - a.y) * dy) / l2 : 0;
    t = Math.max(0, Math.min(1, t));
    const d = Math.hypot(px - (a.x + t * dx), py - (a.y + t * dy));
    if (d <= tol) return m;
  }
  return null;
}

// Given a pointer event, recompute a measurement's offset so its dimension line
// follows the cursor in the plane that faces the camera.
function dragDimOffset(m, ev) {
  const container = document.getElementById('canvas3d-wrap');
  const r = container.getBoundingClientRect();
  const ndc = new THREE.Vector2(
    ((ev.clientX - r.left) / r.width) * 2 - 1,
    -((ev.clientY - r.top) / r.height) * 2 + 1
  );
  meas3d.raycaster.setFromCamera(ndc, three.activeCamera);
  const ray = meas3d.raycaster.ray;

  // Build a plane containing the segment and perpendicular to the view, then
  // intersect the cursor ray with it to get a 3D target point.
  const mid = m.a.clone().add(m.b).multiplyScalar(0.5);
  const seg = m.b.clone().sub(m.a);
  if (seg.lengthSq() < 1e-9) return;
  seg.normalize();
  const camDir = three.activeCamera.getWorldDirection(new THREE.Vector3());
  // Plane normal: as close to the camera direction as possible while keeping
  // the segment in-plane → remove the seg-parallel component from camDir.
  let n = camDir.clone().sub(seg.clone().multiplyScalar(camDir.dot(seg)));
  if (n.lengthSq() < 1e-6) n = defaultOffsetDir(m.a, m.b); // fallback
  n.normalize();
  const denom = ray.direction.dot(n);
  let target;
  if (Math.abs(denom) > 1e-6) {
    const tHit = mid.clone().sub(ray.origin).dot(n) / denom;
    target = ray.origin.clone().add(ray.direction.clone().multiplyScalar(tHit));
  } else {
    target = mid.clone();
  }
  // Vector from segment line to target, perpendicular component only
  const rel = target.clone().sub(mid);
  const perp = rel.clone().sub(seg.clone().multiplyScalar(rel.dot(seg)));
  const distAbs = perp.length();
  if (distAbs < 1e-6) { m.offsetDist = 0; return; }
  m.offsetDir = perp.clone().normalize();
  m.offsetDist = distAbs;
  buildMeasurementObjects(m);
  updateMeasScale();
}

function clearAllMeasurements() {
  if (!meas3d.group) return;
  for (const m of meas3d.measurements) {
    for (const o of m.objects) {
      meas3d.group.remove(o);
      if (o.geometry) o.geometry.dispose();
      if (o.material) { if (o.material.map) o.material.map.dispose(); o.material.dispose(); }
    }
  }
  meas3d.measurements = [];
  meas3d.pending = null;
  clearPendingMeasMarker();
  renderMeas3dList();
}

function renderMeas3dList() {
  const list = document.getElementById('meas3dList');
  const countEl = document.getElementById('meas3dCount');
  if (countEl) countEl.textContent = meas3d.measurements.length;
  if (!list) return;
  if (!meas3d.measurements.length) { list.innerHTML = `<p class="hint">${t('noMeas')}</p>`; return; }
  list.innerHTML = meas3d.measurements.map((m, i) => `<div class="mrow"><span class="mn">#${i + 1}</span><span class="mv">${fmt3d(m.dist)} mm</span><button class="x" data-mi="${i}" aria-label="${t('del')}">✕</button></div>`).join('');
  list.querySelectorAll('[data-mi]').forEach(btn => btn.addEventListener('click', () => {
    const m = meas3d.measurements[+btn.dataset.mi]; if (!m) return;
    for (const o of m.objects) { meas3d.group.remove(o); if (o.geometry) o.geometry.dispose(); if (o.material) { if (o.material.map) o.material.map.dispose(); o.material.dispose(); } }
    meas3d.measurements.splice(+btn.dataset.mi, 1); renderMeas3dList();
  }));
}

function setMeasure3dActive(on) {
  meas3d.active = on;
  const btn = document.getElementById('btnMeas3d');
  if (btn) {
    btn.classList.toggle('active', on);
    btn.dataset.meas3d = on ? 'on' : 'off';
  }
  const wrap = document.getElementById('canvas3d-wrap');
  if (wrap) wrap.style.cursor = on ? 'crosshair' : '';
  const hint = document.getElementById('meas3dHint');
  if (hint) {
    hint.innerHTML = on ? t('m3dOn') : t('m3dOff');
  }
  if (!on) {
    meas3d.pending = null;
    clearPendingMeasMarker();
    clearMeasHover();
    clearMeasPreview();
  }
}

// ---- Live hover marker (follows cursor, shows where the click will land) ----
function ensureHoverMarker() {
  ensureMeasGroup();
  if (!meas3d.hoverDot) {
    const geo = new THREE.SphereGeometry(1, 20, 14);
    const mat = new THREE.MeshBasicMaterial({ color: measColorHex(), depthTest: false, transparent: true, opacity: 0.95 });
    const dot = new THREE.Mesh(geo, mat);
    dot.userData.isMeasDot = true;
    dot.renderOrder = 1002;
    dot.visible = false;
    meas3d.group.add(dot);
    meas3d.hoverDot = dot;
    // a thin ring to make a vertex-locked hover point obvious
    const ringGeo = new THREE.RingGeometry(1.6, 2.2, 24);
    const ringMat = new THREE.MeshBasicMaterial({ color: measColorHex(), depthTest: false, transparent: true, opacity: 0.9, side: THREE.DoubleSide });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.userData.isMeasDot = true;
    ring.renderOrder = 1002;
    ring.visible = false;
    meas3d.group.add(ring);
    meas3d.hoverRing = ring;
  }
}

function clearMeasHover() {
  if (meas3d.hoverDot) meas3d.hoverDot.visible = false;
  if (meas3d.hoverRing) meas3d.hoverRing.visible = false;
}

function updateMeasHover(ev) {
  if (!meas3d.active || S3.mode !== '3d') { clearMeasHover(); return; }
  const pick = pickModelPoint(ev);
  if (!pick) { clearMeasHover(); clearMeasPreview(); return; }
  ensureHoverMarker();
  const snapHex = new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue('--snap').trim() || '#b8902f').getHex();
  const col = pick.snapped ? snapHex : measColorHex();
  meas3d.hoverDot.material.color.setHex(col);
  meas3d.hoverDot.position.copy(pick.point);
  meas3d.hoverDot.visible = true;
  if (meas3d.hoverRing) {
    meas3d.hoverRing.material.color.setHex(col);
    meas3d.hoverRing.position.copy(pick.point);
    meas3d.hoverRing.visible = pick.snapped; // ring only when locked to a vertex
    meas3d.hoverRing.lookAt(three.activeCamera.position);
  }
  // Rubber-band preview once the first point is set
  if (meas3d.pending) updateMeasPreview(meas3d.pending, pick.point);
  updateMeasScale();
}

// ---- Rubber-band preview line + live distance ----
function clearMeasPreview() {
  if (meas3d.previewObjs) {
    for (const o of meas3d.previewObjs) {
      meas3d.group.remove(o);
      if (o.geometry) o.geometry.dispose();
      if (o.material) { if (o.material.map) o.material.map.dispose(); o.material.dispose(); }
    }
    meas3d.previewObjs = null;
  }
}

function updateMeasPreview(a, b) {
  clearMeasPreview();
  const col = measColorHex();
  const lineGeo = new THREE.BufferGeometry().setFromPoints([a, b]);
  const lineMat = new THREE.LineBasicMaterial({ color: col, depthTest: false, transparent: true, opacity: 0.7 });
  const line = new THREE.Line(lineGeo, lineMat);
  line.renderOrder = 998;
  meas3d.group.add(line);
  const mid = a.clone().add(b).multiplyScalar(0.5);
  const label = makeMeasLabel(fmt3d(a.distanceTo(b)) + ' mm', mid, col);
  meas3d.group.add(label);
  meas3d.previewObjs = [line, label];
  updateMeasScale();
}

function initMeasure3dHandlers() {
  const wrap = document.getElementById('canvas3d-wrap');
  if (!wrap || wrap.dataset.measBound) return;
  wrap.dataset.measBound = '1';

  // Use pointerup with a small drag threshold so orbiting doesn't add points
  let downX = 0, downY = 0;
  wrap.addEventListener('pointerdown', (e) => {
    if (!meas3d.active) return;
    downX = e.clientX; downY = e.clientY;
    // If pressing on an existing dimension line (and not mid-measurement),
    // grab it to slide the offset. Disable orbit so the camera stays put.
    if (e.button === 0 && !meas3d.pending) {
      const hit = hitTestDimLine3D(e);
      if (hit) {
        meas3d.draggingDim = hit;
        if (three.controls) three.controls.enabled = false;
        wrap.style.cursor = 'grabbing';
        e.stopPropagation();
      }
    }
  });

  // Live hover feedback — the marker tracks the cursor and snaps to corners
  wrap.addEventListener('pointermove', (e) => {
    if (!meas3d.active || S3.mode !== '3d') return;
    if (meas3d.draggingDim) {
      dragDimOffset(meas3d.draggingDim, e);
      clearMeasHover();
      return;
    }
    // show a move cursor when hovering a draggable dimension line
    if (!meas3d.pending && hitTestDimLine3D(e)) {
      wrap.style.cursor = 'move';
      clearMeasHover();
      return;
    }
    wrap.style.cursor = 'crosshair';
    updateMeasHover(e);
  });
  wrap.addEventListener('pointerleave', () => { clearMeasHover(); });

  // Right-click cancels the in-progress point (without orbiting handled by OrbitControls)
  wrap.addEventListener('contextmenu', (e) => {
    if (meas3d.active && meas3d.pending) {
      e.preventDefault();
      meas3d.pending = null;
      clearPendingMeasMarker();
      clearMeasPreview();
    }
  });

  wrap.addEventListener('pointerup', (e) => {
    if (!meas3d.active || S3.mode !== '3d') return;
    // Finish a dimension drag
    if (meas3d.draggingDim) {
      meas3d.draggingDim = null;
      if (three.controls) three.controls.enabled = true;
      wrap.style.cursor = 'crosshair';
      return;
    }
    if (e.button !== 0) return; // only left-click places points
    const moved = Math.hypot(e.clientX - downX, e.clientY - downY);
    if (moved > 6) return; // it was an orbit/pan drag, not a point pick
    const pick = pickModelPoint(e);
    if (!pick) return;
    if (!meas3d.pending) {
      // First point
      meas3d.pending = pick.point.clone();
      ensureMeasGroup();
      clearPendingMeasMarker();
      const dot = makeMeasDot(meas3d.pending, measColorHex());
      dot.userData.isMeasDot = true;
      meas3d.group.add(dot);
      meas3d._pendingDot = dot;
      updateMeasScale();
    } else {
      // Second point — commit the measurement
      addMeasurement(meas3d.pending, pick.point);
      meas3d.pending = null;
      clearPendingMeasMarker();
      clearMeasPreview();
      // keep measure mode on so the user can chain measurements
    }
  });

  document.getElementById('btnMeas3d').addEventListener('click', () => {
    setMeasure3dActive(!meas3d.active);
  });
  document.getElementById('btnClearMeas3d').addEventListener('click', clearAllMeasurements);
  // Esc cancels the in-progress pick (or exits measure mode if nothing pending)
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && meas3d.active) {
      if (meas3d.pending) {
        meas3d.pending = null;
        clearPendingMeasMarker();
        clearMeasPreview();
      } else {

    h += `<p class="hint">${t('noSheetHint')}</p><div class="kv three" style="margin-top:6px">${field('shW', 'X', '2800')}${field('shH', 'Y', '2070')}<div class="f"><label>&nbsp;</label><button class="btn small" data-act="pAddSheet">${t('addSheet')}</button></div></div>
    <div class="row"><button class="btn small" data-act="pSelSheet">${t('selAsSheet')}</button></div>`;
  }
  const num = (k, lab) => `<div class="f"><label for="op_${k}">${lab}</label><input id="op_${k}" data-o="${k}" value="${fmt(o[k])}" inputmode="decimal"></div>`;
  h += `<div class="kv" style="margin-top:8px">${num('gap', t('gap'))}${num('margin', t('margin'))}</div>
  <div class="row"><label class="chk"><input type="checkbox" data-o="withNested" ${o.withNested ? 'checked' : ''}> ${t('withNested')}</label></div>`;
  h += `<div class="row"><button class="btn small" data-act="pRot" title="R">⟲ 90°</button><button class="btn small" data-act="pRotCW" title="Shift+R">⟳ 90°</button><button class="btn small" data-act="pFlipH" title="F">${t('flipH')}</button><button class="btn small" data-act="pFlipV" title="Shift+F">${t('flipV')}</button></div>
  <div class="row"><button class="btn small" data-act="pDup" title="Ctrl+D">${t('duplicate')}</button><button class="btn small" data-act="pEdit">${t('editShape')}</button><button class="btn small" data-act="pDel">${t('del')}</button></div>
  <div class="row"><button class="btn small primary" data-act="pPack">${t('autoPack')}</button><label class="chk"><input type="checkbox" data-o="allowRot" ${o.allowRot ? 'checked' : ''}> ${t('allowRot')}</label></div>`;
  const cnt = { overlap: 0, outside: 0, close: 0 }; chk.forEach(r => { const s = statusOf(r); if (cnt[s] != null) cnt[s]++; });
  if (cnt.overlap || cnt.outside || cnt.close) h += `<div class="warnbox">${[cnt.overlap && t('stOverlapN', cnt.overlap), cnt.outside && t('stOutsideN', cnt.outside), cnt.close && t('stCloseN', cnt.close, fmt(o.gap))].filter(Boolean).join(' · ')}</div>`;
  h += `<div class="plist">${an.parts.map((P, i) => { const st = statusOf(chk[i]); return `<button class="prow ${sel.has(P) ? 'on' : ''}" data-act="pSel" data-i="${i}"><span class="pn">#${P.n}</span><span class="pd">${fmt(P.bb[2] - P.bb[0], 1)} × ${fmt(P.bb[3] - P.bb[1], 1)}${P.holeCount ? ` · ⌀×${P.holeCount}` : ''}${P.host ? ` · ${t('inPart', P.host.n)}` : ''}</span><span class="pill ${st}">${t('st_' + st)}</span></button>`; }).join('')}</div>`;
  el.innerHTML = h;
}
function extAction(b) {
  const a = b.dataset.act;
  if (a === 'dimDel') { S.dims.splice(+b.dataset.i, 1); saveDims(); renderDims(); requestDraw(); return true; }
  if (a === 'dimClear') { S.dims = []; saveDims(); renderDims(); requestDraw(); return true; }
  if (a === 'selHoles') { const d = +b.dataset.d; S.sel.clear(); for (const e of visEnts()) if (e.type === 'circle' && Math.abs(2 * e.r - d) < 0.006 && !ANNO_RX.test(e.layer)) S.sel.add(e.id); selChanged(); return true; }
  if (a === 'selOpen') { S.sel.clear(); for (const ch of getAn().open) ch.ids.forEach(id => S.sel.add(id)); selChanged(); return true; }
  if (a === 'pSel') { const P = getAn().parts[+b.dataset.i]; if (P) { if (tool.name !== 'parts') setTool('parts'); selectParts([P], false); } return true; }
  if (/^p[A-Z]/.test(a)) { partsAction(a); return true; }
  return false;
}

/* ---------- DWG via libredwg-web (from Draft viewer) ---------- */
let libredwgPromise = null;
function loadLibreDwg() {
  if (libredwgPromise) return libredwgPromise;
  libredwgPromise = (async () => {
    const mod = await import('https://cdn.jsdelivr.net/npm/@mlightcad/libredwg-web@latest/+esm');
    const LibreDwg = mod.LibreDwg || (mod.default && mod.default.LibreDwg);
    if (!LibreDwg) throw new Error('LibreDwg not found');
    return { lib: await LibreDwg.create(), mod };
  })().catch(err => { libredwgPromise = null; throw err; });
  return libredwgPromise;
}
async function readDWG(file) {
  showLoading(t('loadDwg'));
  try {
    const buf = new Uint8Array(await file.arrayBuffer());
    const { lib, mod } = await loadLibreDwg();
    const ft = (mod.Dwg_File_Type || (mod.default && mod.default.Dwg_File_Type) || { DWG: 0 }).DWG ?? 0;
    let dwg; try { dwg = lib.dwg_read_data(buf, ft); } catch (e) { dwg = lib.dwg_read_data(buf); }
    const db = lib.convert ? lib.convert(dwg) : dwg;
    if (lib.dwg_free) try { lib.dwg_free(dwg); } catch (e) { }
    const raw = (db && (db.entities || (db.modelSpace && db.modelSpace.entities) || db.objects)) || [];
    const ents = [];
    for (const r of raw) {
      const T = String(r.type || '').toUpperCase(), layer = r.layer || r.layerName || '0';
      const P = (o, a, b) => o ? { x: o.x ?? 0, y: o.y ?? 0 } : { x: a || 0, y: b || 0 };
      if (T === 'LINE') { const a = P(r.startPoint || r.start), b = P(r.endPoint || r.end); ents.push({ layer, type: 'line', x1: a.x, y1: a.y, x2: b.x, y2: b.y }); }
      else if (T === 'CIRCLE' && r.radius > 0) { const c = P(r.center); ents.push({ layer, type: 'circle', cx: c.x, cy: c.y, r: r.radius }); }
      else if (T === 'ARC' && r.radius > 0) { const c = P(r.center); ents.push({ layer, type: 'arc', cx: c.x, cy: c.y, r: r.radius, a0: r.startAngle || 0, a1: r.endAngle || 0 }); }
      else if (T === 'LWPOLYLINE' || T === 'POLYLINE') { const pts = (r.vertices || []).map(v => ({ x: v.x ?? (v.point && v.point.x) ?? 0, y: v.y ?? (v.point && v.point.y) ?? 0, b: v.bulge || 0 })); if (pts.length > 1) ents.push({ layer, type: 'poly', closed: !!(r.closed || r.isClosed || (r.flag & 1)), pts }); }
      else if (T === 'SPLINE') { const src = (r.fitPoints && r.fitPoints.length > 1 ? r.fitPoints : r.controlPoints) || []; if (src.length > 1) ents.push({ layer, type: 'poly', closed: false, pts: src.map(p => ({ x: p.x, y: p.y, b: 0 })) }); }
      else if ((T === 'TEXT' || T === 'MTEXT') && (r.text || r.contents)) { const p = P(r.startPoint || r.insertionPoint || r.position); ents.push({ layer, type: 'text', x: p.x, y: p.y, h: r.textHeight || r.height || 2.5, rot: r.rotation || 0, text: stripMText(String(r.text || r.contents)) }); }
    }
    const layers = {}; const ls = (db && db.tables && db.tables.LAYER && db.tables.LAYER.entries) || [];
    for (const l of ls) layers[l.name || '0'] = { color: Math.abs(l.colorIndex || l.color || 7) || 7, visible: true };
    for (const e of ents) { e.id = nid(); if (!layers[e.layer]) layers[e.layer] = { color: 7, visible: true }; }
    if (!layers['0']) layers['0'] = { color: 7, visible: true };
    hideLoading();
    if (!ents.length) throw new Error(t('emptyFile'));
    return { ents, layers, units: 0, skipped: {} };
  } catch (err) { hideLoading(); throw err; }
}

/* ---------- loading overlay ---------- */
function showLoading(msg) { const el = $('loading'); $('loadingText').textContent = msg; el.hidden = false; }
function hideLoading() { $('loading').hidden = true; }

/* ---------- context menu (right-click) ---------- */
function zoomToBB(bb) {
  if (!bb) return; const w = Math.max(bb[2] - bb[0], 1e-3), h = Math.max(bb[3] - bb[1], 1e-3);
  S.view = { cx: (bb[0] + bb[2]) / 2, cy: (bb[1] + bb[3]) / 2, s: clamp(Math.min((W - 120) / w, (H - 120) / h), 1e-6, 1e6) }; dirtyBase = true; requestDraw();
}
function closeCtx() { const m = $('ctx'); if (m && !m.hidden) { m.hidden = true; m.innerHTML = ''; } }
function openCtx(x, y) {
  const has = S.sel.size > 0, items = [];
  const it = (label, key, fn, off) => items.push({ label, key, fn, off });
  if (S.lastTool && TOOLS[S.lastTool]) it(t('repeat', t(S.lastTool)), 'Enter', () => setTool(S.lastTool));
  it(t('undo'), 'Ctrl+Z', undo, !S.undo.length); it(t('redo'), 'Ctrl+Y', redo, !S.redo.length);
  items.push('-');
  it(t('move'), 'M', () => setTool('move'), !has); it(t('copy'), 'K', () => setTool('copy'), !has);
  it(t('rot90'), tool.name === 'parts' ? 'R' : '', () => { const bb = bboxOf(selEnts()); applyM(mRot(PI / 2, { x: (bb[0] + bb[2]) / 2, y: (bb[1] + bb[3]) / 2 })); }, !has);
  it(t('flipH'), tool.name === 'parts' ? 'F' : '', () => quick('flipH'), !has);
  it(t('copyClip'), 'Ctrl+C', () => copySel(false), !has); it(t('paste'), 'Ctrl+V', pasteClip, !(S.clip || (() => { try { return localStorage.getItem('dxfed.clip'); } catch (e) { return null; } })()));
  it(t('join'), 'J', () => runAction('join'), !has); it(t('explode'), 'X', () => runAction('explode'), !has);
  it(t('del'), 'Del', () => runAction('del'), !has);
  items.push('-');
  it(t('selAll'), 'Ctrl+A', () => { for (const e of visEnts()) S.sel.add(e.id); selChanged(); });
  if (has) it(t('zoomSel'), '', () => zoomToBB(bboxOf(selEnts())));
  it(t('fit'), 'Z', fit);
  const m = $('ctx');
  m.innerHTML = items.map((o, i) => o === '-' ? '<hr>' : `<button type="button" role="menuitem" data-ci="${i}" ${o.off ? 'disabled' : ''}><span>${esc(o.label)}</span><kbd>${o.key}</kbd></button>`).join('');
  m.hidden = false;
  const r = m.getBoundingClientRect(); m.style.left = Math.min(x, innerWidth - r.width - 6) + 'px'; m.style.top = Math.min(y, innerHeight - r.height - 6) + 'px';
  m.onclick = ev => { const b = ev.target.closest('[data-ci]'); if (!b || b.disabled) return; const o = items[+b.dataset.ci]; closeCtx(); o.fn(); focusCmd(); };
}
document.addEventListener('pointerdown', ev => { if (!ev.target.closest('#ctx')) closeCtx(); }, true);
window.addEventListener('resize', closeCtx);

/* ---------- keyboard shortcut overlay ---------- */
function openHelp() { $('helpBody').innerHTML = t('helpHtml'); $('helpOverlay').hidden = false; }
function closeHelp() { $('helpOverlay').hidden = true; focusCmd(); }
$('bHelp').onclick = openHelp; $('helpClose').onclick = closeHelp;
$('helpOverlay').addEventListener('click', ev => { if (ev.target.id === 'helpOverlay') closeHelp(); });

/* ---------- zoom buttons ---------- */
$('zIn').onclick = () => { zoomAt(W / 2, H / 2, 1.4); focusCmd(); };
$('zOut').onclick = () => { zoomAt(W / 2, H / 2, 1 / 1.4); focusCmd(); };
$('zFit').onclick = () => { fit(); focusCmd(); };

/* ---------- boot ---------- */
const th = LS.get('dxfed.theme', null); if (th) document.documentElement.dataset.theme = th;
readColors();
const saved = LS.get('dxfed.doc', null);
if (saved && saved.doc && saved.doc.ents && saved.doc.ents.length) { S.doc = saved.doc; S.fname = saved.fname || ''; S.sample = !!saved.sample; S.sheetRect = saved.sheetRect || null; bumpIds(S.doc.ents); }
else { S.doc = sampleDoc(); S.sample = true; S.fname = ''; }
if (!S.doc.layers[S.curLayer]) S.curLayer = Object.keys(S.doc.layers)[0] || '0';
reindex();
tool = TOOLS.select();
bindPanels(); bind3D(); syncToggles(); applyLang(); switchMode('2d');
new ResizeObserver(() => { const first = W <= 1; resize(); if (first) fit(); }).observe(stage);
resize(); fit(); updateInfo(); focusCmd();
window.__dxfed = { S, S3, getAn, getChk, partsAction, packSheet, switchMode, projectionDoc, segsToEnts, w2s, s2w, setTool, parseDXF, writeDXF, fit, readFile, doResize, runAction, getTool: () => tool, commit, pushUndo };
})();
